<!doctype html><html><head><meta charset="utf-8"></head><body style="background:#7cbf5a">
<div id="ui"></div>
<script type="module">
import './src/style.css';
import { createHud } from './src/ui/hud';
const hud = createHud(document.getElementById('ui'), 'ABCD', 'a');
let stink = 10;
const mk = () => ({ time: 30, players: [{ id: 'a', name: 'Pawel', color: 0x2bb24c, busId: 1, connected: true }], buses: [{ id: 1, x: 0, z: 0, angle: 0, speed: 0, driverId: 'a', stink }], tiles: [], ownScreen: { x: 640, y: 360 } });
window.setStink = (v) => { stink = v; };
function loop() { hud.update(mk()); requestAnimationFrame(loop); }
loop();
</script></body></html>
